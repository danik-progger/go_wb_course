<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-center">Inventory Management System</h1>

                <!-- Login section -->
                <div id="login-section" class="card mb-4">
                    <div class="card-header">
                        <h3>Login</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="role-select" class="form-label">Select Role:</label>
                            <select class="form-select" id="role-select">
                                <option value="user">User</option>
                                <option value="manager">Manager</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password:</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password">
                        </div>
                        <button id="login-btn" class="btn btn-primary">Login</button>
                        <button id="signup-btn" class="btn btn-secondary">Sign Up</button>
                        <div id="login-status" class="mt-2"></div>
                    </div>
                </div>

                <!-- Inventory management section (hidden initially) -->
                <div id="inventory-section" class="d-none">
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h3>Inventory Items</h3>
                            <button id="add-item-btn" class="btn btn-success">Add New Item</button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped" id="inventory-table">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>Description</th>
                                            <th>Quantity</th>
                                            <th>Price</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="inventory-tbody">
                                        <!-- Items will be loaded here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Add/Edit form (hidden initially) -->
                    <div id="item-form-section" class="card mb-4 d-none">
                        <div class="card-header">
                            <h3 id="form-title">Add New Item</h3>
                        </div>
                        <div class="card-body">
                            <form id="item-form">
                                <input type="hidden" id="item-id">
                                <div class="mb-3">
                                    <label for="item-name" class="form-label">Name:</label>
                                    <input type="text" class="form-control" id="item-name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="item-description" class="form-label">Description:</label>
                                    <textarea class="form-control" id="item-description"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="item-quantity" class="form-label">Quantity:</label>
                                    <input type="number" class="form-control" id="item-quantity" min="0" required>
                                </div>
                                <div class="mb-3">
                                    <label for="item-price" class="form-label">Price:</label>
                                    <input type="number" step="0.01" class="form-control" id="item-price" min="0" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Save Item</button>
                                <button type="button" id="cancel-form-btn" class="btn btn-secondary">Cancel</button>
                            </form>
                        </div>
                    </div>

                    <!-- History section (hidden initially) -->
                    <div id="history-section" class="card mb-4 d-none">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h3>Item History</h3>
                            <button id="close-history-btn" class="btn btn-secondary">Close</button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped" id="history-table">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Action</th>
                                            <th>Old Values</th>
                                            <th>New Values</th>
                                            <th>Changed By</th>
                                            <th>Changed At</th>
                                        </tr>
                                    </thead>
                                    <tbody id="history-tbody">
                                        <!-- History records will be loaded here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
